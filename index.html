
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>American Conference</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @font-face {
  font-family: 'Cinzel';
  src: url('/Cinzel-SemiBold.ttf') format('truetype');
  font-weight: 600;
  font-style: normal;
}

    body {
      background: #ffffff;
      color: #222222;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 1440px;
      margin: 0 auto;
    }

    header { 
      padding: 32px 0; border-bottom: none; 
    }

    .logos { 
      display: flex; align-items: center; gap: 50px; 
    }

    .logos img { 
      width: 320px; height: 190px; object-fit: contain; object-position: center; 
    }

    main {
      padding-top: 65px;
      padding-bottom: 50px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #222222;
      margin-bottom: 25px;
    }

    h1 {
  font-family: 'Cinzel', serif;
  font-size: clamp(24px, 4vw, 36px);
  font-weight: 600;
  letter-spacing: 0;
}

    .download {
      color: #222222;
      font-size: 13px;
      text-decoration: underline;
      text-underline-offset: 4px;
      white-space: nowrap;
    }

    .pdf-viewer {
  width: 100%;
  height: auto;
  min-height: 400px;
  border: none;
  background: #ffffff;
  overflow: visible;
}

    .pdf-viewer iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    footer {
      border-top: 1px solid #e5e5e5;
      padding: 20px 0;
      color: #777777;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      header {
        padding: 20px 0;
      }

      .logos { 
        gap: 5px;
      }

      .logos img { 
        width: 160px; height: 95px; 
      }

      main {
        padding-top: 40px;
      }

      .section-heading {
        align-items: flex-start;
      }

      .pdf-viewer {
        height: 70vh;
        min-height: 450px;
      }
    }


    .social-links {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 22px;
  padding-top: 25px;
  padding-bottom: 15px;
}

.social-links a {
  color: #222222;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.2s ease;
}

.social-links a:hover {
  opacity: 0.55;
}

.social-links svg {
  width: 25px;
  height: 25px;
}

    
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="logos">
        <img src="/albanian.png" alt="Albanian conference logo">
        <img src="/english.png" alt="English conference logo">
      </div>
    </header>

    <div class="social-links">
  <a href="https://www.instagram.com/filozofia_unipr?obrf=MXQyMm5kb2EyY3Z0cg==" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="5"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="18" cy="6" r="0.8" fill="currentColor"/>
    </svg>
  </a>

  <a href="https://www.facebook.com/share/1V9ayAuXYi/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M13.5 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.1H7.3V13h2.8v8h3.4z"/>
    </svg>
  </a>
</div>

    <main>
      <div class="section-heading">
        <h1>Agjenda/ Agenda</h1>

        <a class="download" href="/agenda.pdf" download>
          Download PDF ↓
        </a>
      </div>

      <div id="pdf-container" class="pdf-viewer">
        
      </div>
    </main>

    <footer>
      DEPARTAMENTI I FILOZOFISË
    </footer>

  </div>

  <script type="module">
  import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

  const container = document.getElementById('pdf-container');

  async function loadPDF() {
    try {
      const pdf = await pdfjsLib.getDocument('/agenda.pdf').promise;

      for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
        const page = await pdf.getPage(pageNumber);
        const viewport = page.getViewport({ scale: 1 });
        const scale = container.clientWidth / viewport.width;
        const scaledViewport = page.getViewport({ scale });

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');

        const outputScale = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(scaledViewport.width * outputScale);
        canvas.height = Math.floor(scaledViewport.height * outputScale);

        canvas.style.width = '100%';
        canvas.style.height = 'auto';
        canvas.style.display = 'block';
        canvas.style.marginBottom = '16px';

        container.appendChild(canvas);

        await page.render({
          canvasContext: context,
          viewport: scaledViewport,
          transform: [outputScale, 0, 0, outputScale, 0, 0]
        }).promise;
      }
    } catch (error) {
      console.error('PDF loading error:', error);
      container.textContent = 'Unable to load the agenda PDF.';
    }
  }

  loadPDF();
</script>


</body>
</html>
