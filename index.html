
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>American Conference</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @font-face {
  font-family: 'Cinzel';
  src: url('/Cinzel-SemiBold.ttf') format('truetype');
  font-weight: 600;
  font-style: normal;
}

    body {
      background: #ffffff;
      color: #222222;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 1440px;
      margin: 0 auto;
    }

    header { 
      padding: 32px 0; border-bottom: none; 
    }

    .logos { 
      display: flex; align-items: center; gap: 2px; 
    }

    .logos img { 
      width: 320px; height: 190px; object-fit: contain; object-position: center; 
    }

    main {
      padding-top: 65px;
      padding-bottom: 50px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #222222;
      margin-bottom: 25px;
    }

    h1 {
  font-family: 'Cinzel', serif;
  font-size: clamp(24px, 4vw, 36px);
  font-weight: 600;
  letter-spacing: 0;
}

    .download {
      color: #222222;
      font-size: 13px;
      text-decoration: underline;
      text-underline-offset: 4px;
      white-space: nowrap;
    }

    .pdf-viewer {
      width: 100%;
      height: 65vh;
      min-height: 400px;
      border: 1px solid #e5e5e5;
      background: #f7f7f7;
    }

    .pdf-viewer iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    footer {
      border-top: 1px solid #e5e5e5;
      padding: 20px 0;
      color: #777777;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      header {
        padding: 20px 0;
      }

      .logos { 
        gap: 5px;
      }

      .logos img { 
        width: 160px; height: 95px; 
      }

      main {
        padding-top: 40px;
      }

      .section-heading {
        align-items: flex-start;
      }

      .pdf-viewer {
        height: 70vh;
        min-height: 450px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="logos">
        <img src="/albanian.png" alt="Albanian conference logo">
        <img src="/english.png" alt="English conference logo">
      </div>
    </header>

    <main>
      <div class="section-heading">
        <h1>Agjenda/ Agenda</h1>

        <a class="download" href="/agenda.pdf" download>
          Download PDF ↓
        </a>
      </div>

      <div class="pdf-viewer">
        <iframe
          src="/agenda.pdf#view=FitH"
          title="Conference agenda">
        </iframe>
      </div>
    </main>

    <footer>
      American Conference
    </footer>

  </div>

</body>
</html>
